name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        # --locked fails if uv.lock has drifted from pyproject.toml, so a
        # dependency change without a re-lock is caught here rather than
        # silently resolving to something different from local.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
